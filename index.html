<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Hopper</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --bg: radial-gradient(circle at top, #101a3a 0%, #05060b 60%, #000 100%);
      --accent: #27f3ff;
      --warning: #ff417d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: #f5f9ff;
      padding: 1.5rem;
    }

    main {
      width: min(680px, 100%);
      display: grid;
      gap: 1rem;
      justify-items: center;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 2.75rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    p {
      margin: 0;
      opacity: 0.8;
      line-height: 1.5;
    }

    canvas {
      width: min(100%, 600px);
      aspect-ratio: 3 / 4;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      background: rgba(6, 9, 16, 0.75);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .hud {
      display: flex;
      gap: 1.5rem;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    button {
      padding: 0.7rem 1.6rem;
      background: transparent;
      color: var(--accent);
      border: 1px solid rgba(39, 243, 255, 0.4);
      border-radius: 999px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    button:hover,
    button:focus-visible {
      background: rgba(39, 243, 255, 0.1);
      box-shadow: 0 0 18px rgba(39, 243, 255, 0.2);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .hud {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Star Hopper</h1>
    <p>Use the arrow keys or A/D to dodge the incoming asteroids. Survive as long as you can while building combo streaks for bonus points!</p>
    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Best: <span id="best">0</span></div>
      <div>Combo: <span id="combo">x1</span></div>
    </div>
    <canvas id="game" width="600" height="800" aria-label="Star Hopper arcade canvas"></canvas>
    <button id="restart" class="hidden">Play Again</button>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const comboEl = document.getElementById("combo");
    const restartBtn = document.getElementById("restart");

    const STAR_COUNT = 120;
    const ASTEROID_BASE_SPEED = 2.2;
    const ASTEROID_ACCELERATION = 0.012;
    const PLAYER_SPEED = 6;
    const PLAYER_SIZE = 44;

    let bestScore = Number(localStorage.getItem("star-hopper-best")) || 0;
    bestEl.textContent = bestScore;

    const keys = new Set();

    const stars = Array.from({ length: STAR_COUNT }, () => createStar());

    let asteroids = [];
    let player;
    let score = 0;
    let combo = 1;
    let comboTimer = 0;
    let gameOver = false;
    let tick = 0;

    function createStar() {
      return {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        speed: 0.6 + Math.random() * 1.4,
        radius: Math.random() * 1.2 + 0.3
      };
    }

    function resetGame() {
      player = {
        x: canvas.width / 2,
        y: canvas.height - 100,
        vx: 0
      };
      asteroids = [];
      score = 0;
      combo = 1;
      comboTimer = 0;
      tick = 0;
      gameOver = false;
      lastTime = performance.now();
      restartBtn.classList.add("hidden");
      updateHUD();
      loop();
    }

    function spawnAsteroid() {
      const width = 24 + Math.random() * 36;
      const radius = width / 2;
      const points = Array.from({ length: 7 }, (_, i) => {
        const angle = (Math.PI * 2 * i) / 7;
        const r = radius * (0.72 + Math.random() * 0.28);
        return {
          x: Math.cos(angle) * r,
          y: Math.sin(angle) * r
        };
      });
      asteroids.push({
        x: Math.random() * (canvas.width - width) + radius,
        y: -width,
        radius,
        speed: ASTEROID_BASE_SPEED + tick * ASTEROID_ACCELERATION,
        spin: (Math.random() - 0.5) * 0.02,
        angle: Math.random() * Math.PI * 2,
        points
      });
    }

    function updateStars(delta) {
      for (const star of stars) {
        star.y += star.speed * delta;
        if (star.y > canvas.height) {
          star.x = Math.random() * canvas.width;
          star.y = -2;
          star.speed = 0.6 + Math.random() * 1.4;
        }
      }
    }

    function updatePlayer() {
      player.vx = 0;
      if (keys.has("ArrowLeft") || keys.has("a")) {
        player.vx = -PLAYER_SPEED;
      }
      if (keys.has("ArrowRight") || keys.has("d")) {
        player.vx = PLAYER_SPEED;
      }
      player.x += player.vx;
      player.x = Math.max(PLAYER_SIZE / 2, Math.min(canvas.width - PLAYER_SIZE / 2, player.x));
    }

    function updateAsteroids(delta) {
      for (const asteroid of asteroids) {
        asteroid.y += asteroid.speed * delta;
        asteroid.angle += asteroid.spin * delta;
      }
      asteroids = asteroids.filter(a => a.y < canvas.height + 60);

      const spawnRate = Math.max(600 - tick * 2.5, 180);
      if (tick % Math.round(spawnRate / 16) === 0) {
        spawnAsteroid();
      }
    }

    function checkCollisions() {
      for (const asteroid of asteroids) {
        const dx = asteroid.x - player.x;
        const dy = asteroid.y - player.y;
        const distance = Math.hypot(dx, dy);
        if (distance < asteroid.radius + PLAYER_SIZE * 0.4) {
          handleGameOver();
          break;
        }
      }
    }

    function updateScore(delta) {
      score += delta * 0.01 * combo;
      comboTimer -= delta;
      if (comboTimer <= 0 && combo > 1) {
        combo = 1;
      }
      updateHUD();
    }

    function updateHUD() {
      scoreEl.textContent = Math.floor(score);
      comboEl.textContent = `x${combo}`;
      bestEl.textContent = bestScore;
    }

    function handleGameOver() {
      gameOver = true;
      restartBtn.classList.remove("hidden");
      bestScore = Math.max(bestScore, Math.floor(score));
      localStorage.setItem("star-hopper-best", bestScore);
      updateHUD();
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#040713");
      gradient.addColorStop(1, "#010207");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
      for (const star of stars) {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.beginPath();
      ctx.moveTo(0, -PLAYER_SIZE / 1.6);
      ctx.lineTo(PLAYER_SIZE / 2.4, PLAYER_SIZE / 2);
      ctx.lineTo(0, PLAYER_SIZE / 4);
      ctx.lineTo(-PLAYER_SIZE / 2.4, PLAYER_SIZE / 2);
      ctx.closePath();
      const gradient = ctx.createLinearGradient(0, -PLAYER_SIZE / 2, 0, PLAYER_SIZE / 2);
      gradient.addColorStop(0, "rgba(39, 243, 255, 0.9)");
      gradient.addColorStop(1, "rgba(20, 120, 220, 0.6)");
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.restore();
    }

    function drawAsteroids() {
      for (const asteroid of asteroids) {
        ctx.save();
        ctx.translate(asteroid.x, asteroid.y);
        ctx.rotate(asteroid.angle);
        const gradient = ctx.createRadialGradient(0, 0, asteroid.radius * 0.3, 0, 0, asteroid.radius);
        gradient.addColorStop(0, "#fff4c1");
        gradient.addColorStop(0.5, "#f0b156");
        gradient.addColorStop(1, "#5f2f1f");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        asteroid.points.forEach(({ x, y }, index) => {
          if (index === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        });
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    function drawCombo() {
      if (combo <= 1) return;
      ctx.fillStyle = "rgba(39, 243, 255, 0.35)";
      ctx.font = "bold 42px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`Combo x${combo}`, canvas.width / 2, canvas.height / 2);
    }

    let lastTime = performance.now();

    function loop(now = performance.now()) {
      if (gameOver) return;
      const delta = now - lastTime;
      lastTime = now;
      tick++;

      updateStars(delta * 0.06);
      updatePlayer();
      updateAsteroids(delta * 0.06);

      if (tick % 240 === 0) {
        combo = Math.min(combo + 1, 9);
        comboTimer = 4000;
      }

      updateScore(delta);
      checkCollisions();
      draw();

      requestAnimationFrame(loop);
    }

    function draw() {
      drawBackground();
      drawPlayer();
      drawAsteroids();
      drawCombo();
    }

    restartBtn.addEventListener("click", resetGame);

    window.addEventListener("keydown", (event) => {
      keys.add(event.key);
      if (gameOver && event.key === "Enter") {
        resetGame();
      }
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key);
    });

    canvas.addEventListener("pointerdown", (event) => {
      if (gameOver) return;
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      player.x = x * (canvas.width / rect.width);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (event.buttons === 0) return;
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      player.x = x * (canvas.width / rect.width);
    });

    resetGame();
    draw();
  </script>
</body>
</html>
